<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Скоро вернемся</title>
<style>
  :root {
    --bg: #121212;
    --text: #e8e8ea;
    --orange: #ff8c1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .message {
    font-size: clamp(28px, 8vw, 56px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    max-width: 800px;
  }
  .message span {
    color: var(--orange);
  }
</style>
</head>
<body>
  <div class="message">
    На <span>ремонте</span>,<br>
    скоро все вернется
  </div>
</body>
</html>
